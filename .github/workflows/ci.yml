name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Spark 3.5 needs Java 17, the same version Glue 5.1 runs on.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install "pyspark==3.5.6" "dbt-databricks==1.12.7"

      - name: Lint
        run: ruff check .

      # Replayer, silver_lib (Spark), Airflow helpers. The DAG integrity test skips here
      # (no Airflow install) and runs inside the Airflow image instead.
      - name: Tests
        run: pytest -q

      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir ci --no-send-anonymous-usage-stats
